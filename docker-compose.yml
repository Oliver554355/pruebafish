version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: chosica
      POSTGRES_PASSWORD: chosica
      POSTGRES_DB: chosica
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
